<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Thank You | LichaTwist</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;

            font-family: Inter, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #061a33,
                    #0d355c
                );

            color: #ffffff;
        }

        .thank-you-box {
            width: min(100%, 620px);

            padding: 55px 35px;

            text-align: center;

            background: rgba(255,255,255,.08);

            border: 1px solid rgba(255,255,255,.15);

            border-radius: 20px;

            box-shadow:
                0 25px 70px rgba(0,0,0,.25);
        }

        .check {
            width: 75px;
            height: 75px;

            margin: 0 auto 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #d7ad4a;

            color: #061a33;

            font-size: 38px;
            font-weight: 800;
        }

        .small-title {
            color: #d7ad4a;

            font-size: 11px;
            font-weight: 800;

            letter-spacing: 2px;

            margin-bottom: 12px;
        }

        h1 {
            font-family: "Playfair Display", serif;

            font-size: clamp(36px, 7vw, 58px);

            line-height: 1.05;

            margin-bottom: 18px;
        }

        p {
            color: rgba(255,255,255,.7);

            line-height: 1.8;

            max-width: 480px;

            margin: 0 auto 30px;
        }

        .home-button {
            display: inline-block;

            padding: 15px 25px;

            background: #d7ad4a;

            color: #061a33;

            text-decoration: none;

            border-radius: 6px;

            font-weight: 800;

            font-size: 13px;
        }

        .home-button:hover {
            transform: translateY(-2px);
        }

        .brand {
            margin-top: 35px;

            color: rgba(255,255,255,.45);

            font-size: 12px;
            letter-spacing: 1.5px;
        }

    </style>

</head>


<body>

    <div class="thank-you-box">

        <div class="check">
            ✓
        </div>

        <div class="small-title">
            MESSAGE RECEIVED
        </div>

        <h1>
            Thank You!
        </h1>

        <p>
            Your message has been sent successfully.
            Our team has received your enquiry and
            will get back to you soon.
        </p>

        <a
            href="index.html"
            class="home-button">

            Back to LichaTwist

        </a>

        <div class="brand">
            LICHA TWIST® &nbsp; | &nbsp;
            INSPIRING AND INNOVATIVE
        </div>

    </div>

</body>

</html>
